[package]
name = "overchat"
version = "0.6.0"
description = "OverChat — Twitch chat overlay for games"
edition = "2021"
rust-version = "1.80"

[lib]
name = "overchat_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.3", features = ["time", "macros", "sync"] }
thiserror = "2"
tauri-plugin-window-state = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
